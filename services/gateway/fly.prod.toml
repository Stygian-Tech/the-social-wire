# Production gateway (main). Dev uses fly.toml.
#
# Deploy: bash deploy.sh main

app = 'the-social-wire-prod-gateway'
primary_region = 'iah'

[build]
  dockerfile = 'Dockerfile'
  context = '../..'

[deploy]
  wait_timeout = '10m0s'

[env]
  APP_ENV = 'prod'
  POSTGRES_MAX_CONNECTIONS = '2'
  PORT = '8080'
  APPVIEW_BASE_URL = 'http://the-social-wire-prod-appview.internal:8081'
  OPERATIONS_BASE_URL = 'http://the-social-wire-prod-operations.internal:8083'
  OAUTH_OPERATIONS_ORIGIN = 'https://operations.thesocialwire.app'
  OAUTH_OPERATIONS_CLIENT_ID = 'https://api.thesocialwire.app/operations-oauth-client-metadata.json'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = '30s'
    timeout = '10s'
    grace_period = '1m0s'
    method = 'GET'
    path = '/readyz'

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256
