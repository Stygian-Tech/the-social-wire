name: The Social Wire
options:
  minimumXcodeGenVersion: 2.43.0
  # Use **`group`** (not **`syncedFolder`**) so **Assets.xcassets** gets explicit build membership and a normal
  # Compile Asset Catalog phase. **`syncedFolder`** on XcodeGen before 2.45 can omit resources; Xcode also hides
  # per-file Target Membership for synchronized roots.
  defaultSourceDirectoryType: group
  deploymentTarget:
    iOS: "18.0"
    macOS: "15.0"
configs:
  Debug: debug
  Beta: release
  Release: release
settings:
  base:
    SWIFT_VERSION: 6.0
    MARKETING_VERSION: 1.0
    CURRENT_PROJECT_VERSION: 1
    DEVELOPMENT_TEAM: G39TU2R26A
    CODE_SIGN_STYLE: Automatic
packages:
  LatrKit:
    url: https://github.com/Stygian-Tech/latr-kit.git
    revision: f0e2ce680b07fa41d28d7b1cfeac01a25d5df2c6
targets:
  SocialWire:
    type: application
    platform: iOS
    sources:
      - path: SocialWire
      # `.xcassets` outside this folder — e.g. `apps/apple/Media.xcassets` — will NOT be merged in; move it under
      # `SocialWire/` or add a second `- path:` entry with `type: folder.assetcatalog`, then run `xcodegen generate`.
    dependencies:
      - package: LatrKit
    info:
      path: SocialWire/Info.plist
      properties:
        CFBundleDisplayName: The Social Wire
        # Short bundle name (Settings, Spotlight, etc.); **`PRODUCT_NAME`** stays `SocialWire` for module / binary paths.
        CFBundleName: The Social Wire
        CFBundleURLTypes:
          - CFBundleURLName: com.samclemente.the-social-wire.oauth
            CFBundleURLSchemes:
              - app.thesocialwire
              - app.thesocialwire.api
              - app.thesocialwire.testing.api
        LSRequiresIPhoneOS: true
        UIApplicationSupportsIndirectInputEvents: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.samclemente.the-social-wire
        PRODUCT_NAME: SocialWire
        PRODUCT_MODULE_NAME: SocialWire
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_ENTITLEMENTS: SocialWire/SocialWire.entitlements
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.news
      configs:
        Beta:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) SOCIALWIRE_TESTING_API
  SocialWireTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: SocialWireTests
    dependencies:
      - target: SocialWire
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.samclemente.the-social-wire.tests
        PRODUCT_NAME: SocialWireTests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/SocialWire.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/SocialWire"
        BUNDLE_LOADER: "$(TEST_HOST)"
      configs:
        Beta:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) SOCIALWIRE_TESTING_API
  SocialWireUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: SocialWireUITests
    dependencies:
      - target: SocialWire
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.samclemente.the-social-wire.ui-tests
        PRODUCT_NAME: SocialWireUITests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: SocialWire
  SocialWireMac:
    type: application
    platform: macOS
    sources:
      - path: SocialWire
        excludes:
          - Info.plist
          - SocialWire.entitlements
      - path: SocialWireMac
        excludes:
          - Info.plist
          - SocialWireMac.entitlements
    dependencies:
      - package: LatrKit
    info:
      path: SocialWireMac/Info.plist
      properties:
        CFBundleDisplayName: The Social Wire
        CFBundleName: The Social Wire
        CFBundleURLTypes:
          - CFBundleURLName: com.samclemente.the-social-wire.oauth
            CFBundleURLSchemes:
              - app.thesocialwire
              - app.thesocialwire.api
              - app.thesocialwire.testing.api
        LSApplicationCategoryType: public.app-category.news
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.samclemente.the-social-wire
        PRODUCT_NAME: SocialWire
        PRODUCT_MODULE_NAME: SocialWire
        CODE_SIGN_ENTITLEMENTS: SocialWireMac/SocialWireMac.entitlements
      configs:
        Beta:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) SOCIALWIRE_TESTING_API
  SocialWireMacTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: SocialWireTests
    dependencies:
      - target: SocialWireMac
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.samclemente.the-social-wire.macos.tests
        PRODUCT_NAME: SocialWireMacTests
        PRODUCT_MODULE_NAME: SocialWireTests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/SocialWire.app/Contents/MacOS/SocialWire"
        BUNDLE_LOADER: "$(TEST_HOST)"
      configs:
        Beta:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) SOCIALWIRE_TESTING_API
  SocialWireMacUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - path: SocialWireMacUITests
    dependencies:
      - target: SocialWireMac
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.samclemente.the-social-wire.macos.ui-tests
        PRODUCT_NAME: SocialWireMacUITests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: SocialWireMac
schemes:
  SocialWire:
    build:
      targets:
        SocialWire: all
        SocialWireTests: [test]
        SocialWireUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - SocialWireTests
        - SocialWireUITests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
  SocialWire-TestFlight:
    build:
      targets:
        SocialWire: all
        SocialWireTests: [test]
        SocialWireUITests: [test]
    run:
      config: Beta
    test:
      config: Beta
      targets:
        - SocialWireTests
        - SocialWireUITests
    profile:
      config: Beta
    analyze:
      config: Beta
    archive:
      config: Beta
  SocialWire-macOS:
    build:
      targets:
        SocialWireMac: all
        SocialWireMacTests: [test]
        SocialWireMacUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - SocialWireMacTests
        - SocialWireMacUITests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
