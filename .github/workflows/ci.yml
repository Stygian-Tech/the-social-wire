name: CI

# Railway deploys protected branch merges from its GitHub integration. GitHub Actions
# verifies the pull request merge commit before it can reach dev or main.
on:
  pull_request:
    branches: [main, dev]
  merge_group:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  NODE_VERSION: "24.19.0"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Detect Changed Paths
    runs-on: ubuntu-latest
    outputs:
      web: ${{ steps.filter.outputs.web }}
      operations_web: ${{ steps.filter.outputs.operations_web }}
      apple: ${{ steps.filter.outputs.apple }}
      redis: ${{ steps.filter.outputs.redis }}
      gateway: ${{ steps.filter.outputs.gateway }}
      appview: ${{ steps.filter.outputs.appview }}
      operations: ${{ steps.filter.outputs.operations }}
      go_packages: ${{ steps.filter.outputs.go_packages }}
      jetstream_ingest: ${{ steps.filter.outputs.jetstream_ingest }}
      wire_ingest: ${{ steps.filter.outputs.wire_ingest }}
      podcast_worker: ${{ steps.filter.outputs.podcast_worker }}
      indexing_worker: ${{ steps.filter.outputs.indexing_worker }}
      wire_corpus_edge: ${{ steps.filter.outputs.wire_corpus_edge }}
      database_migrator: ${{ steps.filter.outputs.database_migrator }}
      lexicons: ${{ steps.filter.outputs.lexicons }}
      spec: ${{ steps.filter.outputs.spec }}
      docs: ${{ steps.filter.outputs.docs }}
      benchmark_tools: ${{ steps.filter.outputs.benchmark_tools }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Detect changed paths
        id: filter
        env:
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
          GITHUB_EVENT_PULL_REQUEST_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: bash scripts/ci-detect-changes.sh

  web:
    name: Web
    needs: changes
    if: needs.changes.result == 'success' && needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Cache Bun downloads
        uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-1.3.14-${{ hashFiles('bun.lock') }}
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Typecheck
        run: bunx turbo typecheck --filter=web
      - name: Lint
        run: bunx turbo lint --filter=web
      - name: Test shared PDS read-state protocol
        run: bun --cwd packages/read-state test
      - name: Typecheck shared PDS read-state protocol
        run: bun --cwd packages/read-state typecheck
      - name: Test
        run: bun --cwd apps/web run test:coverage
        env:
          NEXT_PUBLIC_APP_ENV: test

  operations-web:
    name: Operations Web
    needs: changes
    if: needs.changes.result == 'success' && needs.changes.outputs.operations_web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Cache Bun downloads
        uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-1.3.14-${{ hashFiles('bun.lock') }}
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Typecheck
        run: bunx turbo typecheck --filter=operations
      - name: Lint
        run: bunx turbo lint --filter=operations
      - name: Test
        run: bun --cwd apps/operations run test:coverage

  apple:
    name: Apple
    needs: changes
    if: needs.changes.result == 'success' && needs.changes.outputs.apple == 'true'
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: Prepare iOS simulator
        id: simulator
        timeout-minutes: 10
        run: |
          xcodebuild -version
          xcodebuild -runFirstLaunch
          xcrun simctl list runtimes
          # Let simctl choose the newest compatible installed runtime, rather
          # than asking xcodebuild for OS=latest on a pre-created device.
          if ! simulator_id=$(xcrun simctl create SocialWireCI 'iPhone 17 Pro'); then
            xcodebuild -downloadPlatform iOS
            simulator_id=$(xcrun simctl create SocialWireCI 'iPhone 17 Pro')
          fi
          xcrun simctl boot "$simulator_id"
          xcrun simctl bootstatus "$simulator_id" -b
          echo "id=$simulator_id" >> "$GITHUB_OUTPUT"
      - name: Test iOS app with coverage
        env:
          IOS_SIMULATOR_ID: ${{ steps.simulator.outputs.id }}
        run: |
          xcodebuild test \
            -project "apps/apple/The Social Wire.xcodeproj" \
            -scheme SocialWire \
            -destination "platform=iOS Simulator,id=$IOS_SIMULATOR_ID" \
            -enableCodeCoverage YES \
            -resultBundlePath "$RUNNER_TEMP/SocialWireTests.xcresult" \
            CODE_SIGNING_ALLOWED=NO
      - name: Report iOS coverage
        run: xcrun xccov view --report "$RUNNER_TEMP/SocialWireTests.xcresult"

  gateway:
    name: Gateway
    needs: changes
    if: needs.changes.result == 'success' && needs.changes.outputs.gateway == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
      - name: Cache Gateway packages
        uses: actions/cache@v5
        with:
          path: |
            packages/swift/GatewayCore/.build
            packages/swift/SocialWireRedis/.build
            services/gateway/.build
          key: ${{ runner.os }}-swift-gateway-6.2.4-${{ hashFiles('services/gateway/Package.resolved', 'packages/swift/GatewayCore/Package.resolved', 'packages/swift/ThinAppViewCore/Package.resolved', 'packages/swift/SocialWireRedis/Package.resolved') }}
      - uses: swift-actions/setup-swift@v3
        with:
          swift-version: "6.2.4"
          skip-verify-signature: true
      - name: Test GatewayCore
        working-directory: packages/swift/GatewayCore
        run: swift test
      - name: Test Gateway
        working-directory: services/gateway
        run: swift test

  redis:
    name: SocialWire Redis
    needs: changes
    if: needs.changes.result == 'success' && needs.changes.outputs.redis == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      redis:
        image: redis:8.2.8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 20
    steps:
      - uses: actions/checkout@v6
      - uses: swift-actions/setup-swift@v3
        with:
          swift-version: "6.2.4"
          skip-verify-signature: true
      - name: Test Redis package and integration
        working-directory: packages/swift/SocialWireRedis
        run: swift test
        env:
          REDIS_INTEGRATION_URL: redis://127.0.0.1:6379

  appview:
    name: AppView
    needs: changes
    if: needs.changes.result == 'success' && needs.changes.outputs.appview == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: appview_wire_test
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d appview_wire_test"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 30
    steps:
      - uses: actions/checkout@v6
      - name: Apply database migrations for AppView integration tests
        uses: ./.github/actions/prepare-postgres
        with:
          database-url: postgresql://postgres:postgres@127.0.0.1:5432/appview_wire_test
      - name: Cache AppView
        uses: actions/cache@v5
        with:
          path: |
            packages/swift/SocialWireRedis/.build
            services/appview/.build
          key: ${{ runner.os }}-swift-appview-6.2.4-${{ hashFiles('services/appview/Package.resolved', 'packages/swift/GatewayCore/Package.resolved', 'packages/swift/ThinAppViewCore/Package.resolved', 'packages/swift/SocialWireRedis/Package.resolved') }}
      - uses: swift-actions/setup-swift@v3
        with:
          swift-version: "6.2.4"
          skip-verify-signature: true
      - name: Test portable read-state protocol
        working-directory: packages/swift/ReadStateCore
        run: swift test
      - name: Test retained AppView shared contracts
        working-directory: packages/swift/ThinAppViewCore
        env:
          THIN_APPVIEW_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/appview_wire_test?sslmode=disable
          PODCAST_PRIVATE_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/appview_wire_test?sslmode=disable
        run: swift test
      - name: Test retained Wire and topic domains
        run: |
          (cd packages/swift/WireCore && swift test)
          (cd packages/swift/FinanceCore && swift test)
          (cd packages/swift/SportsCore && swift test)
      - name: Test AppView
        working-directory: services/appview
        env:
          WIRE_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/appview_wire_test?sslmode=disable
        run: swift test

  operations:
    name: Operations
    needs: changes
    if: needs.changes.result == 'success' && needs.changes.outputs.operations == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: socialwire_operations_test
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d socialwire_operations_test"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 30
    steps:
      - uses: actions/checkout@v6
      - name: Preload statement statistics for telemetry integration tests
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          docker exec "$POSTGRES_CONTAINER" psql -U postgres -d socialwire_operations_test -v ON_ERROR_STOP=1 \
            -c "ALTER SYSTEM SET shared_preload_libraries = 'pg_stat_statements'"
          docker restart "$POSTGRES_CONTAINER"
          for attempt in $(seq 1 30); do
            echo "Waiting for Postgres after preload restart ($attempt/30)"
            if docker exec "$POSTGRES_CONTAINER" pg_isready -U postgres -d socialwire_operations_test; then
              exit 0
            fi
            sleep 1
          done
          docker logs "$POSTGRES_CONTAINER"
          exit 1
      - name: Apply telemetry database migrations
        uses: ./.github/actions/prepare-postgres
        with:
          database-url: postgresql://postgres:postgres@127.0.0.1:5432/socialwire_operations_test
      - name: Verify statement statistics are available
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          docker exec "$POSTGRES_CONTAINER" psql -U postgres -d socialwire_operations_test -v ON_ERROR_STOP=1 \
            -c "SELECT count(*) FROM pg_stat_statements"
      - name: Cache Operations packages
        uses: actions/cache@v5
        with:
          path: |
            packages/swift/OperationsCore/.build
            services/operations/.build
          key: ${{ runner.os }}-swift-operations-6.2.4-${{ hashFiles('packages/swift/OperationsCore/Package.resolved', 'services/operations/Package.resolved') }}
      - uses: swift-actions/setup-swift@v3
        with:
          swift-version: "6.2.4"
          skip-verify-signature: true
      - name: Test OperationsCore
        working-directory: packages/swift/OperationsCore
        env:
          OPERATIONS_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/socialwire_operations_test?sslmode=disable
        run: swift test --skip 'PostgresRoleLeaseAuthorityTests|PostgresRoleLeaseDiagnosticIntegrationTests|PostgresRoleLeaseDiagnosticTransportTests|PostgresIngestionCensusBudgetTests'
      - name: Test lease deadlines without unrelated test load
        working-directory: packages/swift/OperationsCore
        env:
          OPERATIONS_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/socialwire_operations_test?sslmode=disable
        # Integration tests still exercise their own concurrent transactions.
        run: swift test --skip-build --no-parallel --filter 'PostgresRoleLeaseAuthorityTests|PostgresRoleLeaseDiagnosticIntegrationTests|PostgresRoleLeaseDiagnosticTransportTests|PostgresIngestionCensusBudgetTests'
      - name: Test Operations
        working-directory: services/operations
        run: swift test

  # Real PostgreSQL transactions and actual Swift oracles verify the local Go
  # foundation; this job participates in the required aggregate branch gate.
  go-packages:
    name: Repository-local Go Packages
    needs: changes
    if: needs.changes.result == 'success' && needs.changes.outputs.go_packages == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: socialwire_go_test
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d socialwire_go_test"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: packages/go/go.mod
          cache-dependency-path: |
            packages/go/go.sum
            services/gateway/go.sum
            services/appview/go.sum
            services/operations/go.sum
            services/wire-corpus-edge/go.sum
      - uses: swift-actions/setup-swift@v3
        with:
          swift-version: "6.2.4"
          skip-verify-signature: true
      - name: Apply canonical migrations to disposable Go test database
        uses: ./.github/actions/prepare-postgres
        with:
          database-url: postgresql://postgres:postgres@127.0.0.1:5432/socialwire_go_test
      - name: Check canonical contracts and package inventory
        run: |
          python3 scripts/go/generate-contracts.py --check
          python3 scripts/go/package-inventory.py --check
      - name: Test Go packages and PostgreSQL fences
        working-directory: packages/go
        env:
          GOWORK: "off"
          SOCIALWIRE_GO_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/socialwire_go_test?sslmode=disable
          SOCIALWIRE_GO_CORPUS_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/socialwire_go_test?sslmode=disable
          SOCIALWIRE_GO_WIRE_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/socialwire_go_test?sslmode=disable
          SOCIALWIRE_GO_APPVIEW_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/socialwire_go_test?sslmode=disable
          SOCIALWIRE_GO_READSTATE_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/socialwire_go_test?sslmode=disable
          SOCIALWIRE_GO_OPERATIONS_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/socialwire_go_test?sslmode=disable
          SOCIALWIRE_GO_TOPICS_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/socialwire_go_test?sslmode=disable
        run: |
          test -z "$(gofmt -l .)"
          go vet ./...
          go test -race -p 1 ./...
      - name: Test migrated Go service entry points
        env:
          GOWORK: "off"
          SOCIALWIRE_GO_GATEWAY_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/socialwire_go_test?sslmode=disable
          SOCIALWIRE_GO_APPVIEW_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/socialwire_go_test?sslmode=disable
          SOCIALWIRE_GO_OPERATIONS_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/socialwire_go_test?sslmode=disable
        run: |
          for service in gateway appview operations wire-corpus-edge; do
            (
              cd "services/$service"
              test -z "$(gofmt -l .)"
              go vet ./...
              go test -race -p 1 ./...
            )
          done
      - name: Compare ranking and edition assembly with Swift
        run: |
          bash scripts/go/verify-ranking-parity.sh
          bash scripts/go/verify-edition-parity.sh
          bash scripts/go/verify-domain-ranking-parity.sh

  jetstream-ingest:
    name: Jetstream V2 Ingest
    needs: changes
    if: needs.changes.result == 'success' && needs.changes.outputs.jetstream_ingest == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: socialwire_test
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d socialwire_test"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 30
    steps:
      - uses: actions/checkout@v6
      - name: Apply database migrations
        uses: ./.github/actions/prepare-postgres
        with:
          database-url: postgresql://postgres:postgres@127.0.0.1:5432/socialwire_test
      - uses: actions/setup-go@v6
        with:
          go-version-file: services/jetstream-ingest/go.mod
          cache-dependency-path: services/jetstream-ingest/go.sum
      - name: Test
        working-directory: services/jetstream-ingest
        env:
          SCHEMA_READY_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/socialwire_test?sslmode=disable
          JETSTREAM_INGEST_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/socialwire_test?sslmode=disable
        run: |
          go test -race -coverprofile="$RUNNER_TEMP/jetstream-coverage.out" ./...
          coverage="$(go tool cover -func="$RUNNER_TEMP/jetstream-coverage.out" | awk '/^total:/ { gsub(/%/, "", $3); print $3 }')"
          awk -v coverage="$coverage" 'BEGIN { if (coverage + 0 < 40) exit 1 }'
          echo "Jetstream statement coverage: ${coverage}%"
      - name: Vet
        working-directory: services/jetstream-ingest
        run: go vet ./...

  wire-ingest:
    name: The Wire Global Ingest
    needs: changes
    if: needs.changes.result == 'success' && needs.changes.outputs.wire_ingest == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: services/jetstream-ingest/go.mod
          cache-dependency-path: services/jetstream-ingest/go.sum
      - name: Test isolated Wire pipeline contracts
        working-directory: services/jetstream-ingest
        run: go test -race ./internal/config ./internal/ingest ./internal/service -run 'Wire|PinnedJetstreamClient'

  indexing-worker:
    name: Replicated Indexing Worker
    needs: changes
    if: needs.changes.result == 'success' && needs.changes.outputs.indexing_worker == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: services/indexing-worker/go.mod
          cache-dependency-path: |
            packages/go/go.sum
            services/indexing-worker/go.sum
      - name: Test replicated indexing roles
        working-directory: services/indexing-worker
        env:
          GOWORK: "off"
        run: |
          test -z "$(gofmt -l cmd internal)"
          go vet ./...
          go test -race ./...

  wire-corpus-edge:
    name: The Wire Corpus Edge
    needs: changes
    if: needs.changes.result == 'success' && needs.changes.outputs.wire_corpus_edge == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: socialwire_wire_corpus_test
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d socialwire_wire_corpus_test"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 30
    steps:
      - uses: actions/checkout@v6
      - name: Apply database migrations
        uses: ./.github/actions/prepare-postgres
        with:
          database-url: postgresql://postgres:postgres@127.0.0.1:5432/socialwire_wire_corpus_test
      - name: Verify presentation-only read contract
        run: |
          psql postgresql://postgres:postgres@127.0.0.1:5432/socialwire_wire_corpus_test \
            -X -v ON_ERROR_STOP=1 -f scripts/verify-wire-corpus-serving.sql
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Verify Corpus serving boundary rejects unreviewed payloads and scores
        env:
          CORPUS_SERVING_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/tsw_release_corpus_boundary
          PSQL_BIN: psql
        run: |
          "$PSQL_BIN" postgresql://postgres:postgres@127.0.0.1:5432/socialwire_wire_corpus_test \
            -X -v ON_ERROR_STOP=1 -c 'CREATE DATABASE tsw_release_corpus_boundary TEMPLATE socialwire_wire_corpus_test'
          bun test packages/spec/__tests__/wire-corpus-serving-verifier-postgres.test.ts
      - uses: swift-actions/setup-swift@v3
        with:
          swift-version: "6.2.4"
          skip-verify-signature: true
      - name: Test The Wire Corpus Edge
        working-directory: services/wire-corpus-edge
        env:
          WIRE_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/socialwire_wire_corpus_test?sslmode=disable
        run: swift test

  database-migrator:
    name: Database Migrator
    needs: changes
    if: needs.changes.result == 'success' && needs.changes.outputs.database_migrator == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: socialwire_migrations
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d socialwire_migrations"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 30
    steps:
      - uses: actions/checkout@v6
      - name: Verify PostgreSQL clean shutdown
        run: services/postgres/tests/shutdown.sh
      - name: Check migration runner syntax
        run: |
          bash -n scripts/apply-database-migrations.sh
          bash -n scripts/verify-postgres-restore.sh
      - name: Apply migrations from empty and verify idempotence
        uses: ./.github/actions/prepare-postgres
        with:
          database-url: postgresql://postgres:postgres@127.0.0.1:5432/socialwire_migrations
          verify-idempotence: "true"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Verify telemetry and retention migration guards, interrupted retry, and bounded inbox diagnostics
        env:
          POSTGRES_MIGRATION_TEST_URL: postgresql://postgres:postgres@127.0.0.1:5432/tsw92_telemetry_test
          PSQL_BIN: psql
        run: |
          "$PSQL_BIN" postgresql://postgres:postgres@127.0.0.1:5432/socialwire_migrations \
            -X -v ON_ERROR_STOP=1 -c 'CREATE DATABASE tsw92_telemetry_test'
          bun test --timeout 30000 packages/spec/__tests__/telemetry-index-migration-postgres.test.ts packages/spec/__tests__/operations-retention-migration-postgres.test.ts packages/spec/__tests__/operations-change-retention-postgres.test.ts packages/spec/__tests__/wire-inbox-readiness-postgres.test.ts packages/spec/__tests__/wire-ordered-signal-migration-postgres.test.ts
      - name: Verify Jetstream V2 drain indexes and query plans
        run: |
          psql postgresql://postgres:postgres@127.0.0.1:5432/socialwire_migrations \
            -X -v ON_ERROR_STOP=1 -f scripts/verify-jetstream-v2-drain-indexes.sql
      - name: Verify The Wire inbox claim index and query plan
        run: |
          psql postgresql://postgres:postgres@127.0.0.1:5432/socialwire_migrations \
            -X -v ON_ERROR_STOP=1 -f scripts/verify-wire-inbox-claim-index.sql

  lexicons:
    name: Lexicons
    needs: changes
    if: needs.changes.result == 'success' && needs.changes.outputs.lexicons == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Cache Bun downloads
        uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-1.3.14-${{ hashFiles('bun.lock') }}
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Test
        working-directory: packages/lexicons
        run: bun test

  spec:
    name: OpenAPI Spec
    needs: changes
    if: needs.changes.result == 'success' && needs.changes.outputs.spec == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Cache Bun downloads
        uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-1.3.14-${{ hashFiles('bun.lock') }}
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Test
        working-directory: packages/spec
        run: bun test

  benchmark-tools:
    name: Benchmark Tools
    needs: changes
    if: needs.changes.result == 'success' && needs.changes.outputs.benchmark_tools == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Install PostgreSQL client for isolated SQL tests
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client
      - name: Build isolated PostgreSQL restart fixture
        run: docker build --file scripts/benchmarks/fixtures/postgres-restart/Dockerfile --tag tsw114-postgres-process-restart:test .
      - name: Test benchmark safety and evidence tools
        env:
          TSW_RECEIPT_TEST_ADMIN_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres?sslmode=disable
          RANKING_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres?sslmode=disable
          TSW_RESTART_TEST_IMAGE: tsw114-postgres-process-restart:test
        run: python3 -W error::ResourceWarning -m unittest discover -s scripts/benchmarks/tests

  docs:
    name: Documentation
    needs: changes
    if: needs.changes.result == 'success' && needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Check wiki links and navigation
        run: bash scripts/check-wiki-links.sh

  podcast-worker:
    name: Podcast Media Worker
    needs: changes
    if: needs.changes.result == 'success' && needs.changes.outputs.podcast_worker == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: podcast-validation-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PODCAST_TEST_DATABASE_URL: postgres://postgres:podcast-validation-only@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install media tools
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core
      - name: Cache Bun downloads
        uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-1.3.14-${{ hashFiles('bun.lock') }}
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Typecheck
        run: bun --cwd services/podcast-worker typecheck
      - name: Test media processing and bridge identities
        run: bun --cwd services/podcast-worker test
      - uses: actions/setup-go@v6
        with:
          go-version-file: services/jetstream-ingest/go.mod
          cache-dependency-path: services/jetstream-ingest/go.sum
      - name: Test source entrypoint database gate
        working-directory: services/jetstream-ingest
        shell: bash
        run: |
          set -euo pipefail
          # Compile the test subject, without constructing a deployment image.
          go build -o "$RUNNER_TEMP/schema-ready-test" ./cmd/schema-ready
          status=0
          output="$(env -u DATABASE_URL APP_ENV=dev "$RUNNER_TEMP/schema-ready-test" -- "$(command -v bun)" "$GITHUB_WORKSPACE/services/podcast-worker/src/index.ts" 2>&1)" || status=$?
          if [[ "$status" != "1" || "$output" != *"schema readiness requires DATABASE_URL"* || "$output" == *"absolute application path"* ]]; then
            printf '%s\n' "$output"
            exit 1
          fi

  required:
    name: CI — Required
    needs:
      - changes
      - web
      - operations-web
      - apple
      - redis
      - gateway
      - appview
      - operations
      - go-packages
      - jetstream-ingest
      - wire-ingest
      - podcast-worker
      - indexing-worker
      - wire-corpus-edge
      - database-migrator
      - lexicons
      - spec
      - docs
      - benchmark-tools
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify path-filtered checks
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          WEB_FLAG: ${{ needs.changes.outputs.web }}
          OPERATIONS_WEB_FLAG: ${{ needs.changes.outputs.operations_web }}
          APPLE_FLAG: ${{ needs.changes.outputs.apple }}
          REDIS_FLAG: ${{ needs.changes.outputs.redis }}
          GATEWAY_FLAG: ${{ needs.changes.outputs.gateway }}
          APPVIEW_FLAG: ${{ needs.changes.outputs.appview }}
          OPERATIONS_FLAG: ${{ needs.changes.outputs.operations }}
          GO_PACKAGES_FLAG: ${{ needs.changes.outputs.go_packages }}
          JETSTREAM_INGEST_FLAG: ${{ needs.changes.outputs.jetstream_ingest }}
          WIRE_INGEST_FLAG: ${{ needs.changes.outputs.wire_ingest }}
          PODCAST_WORKER_FLAG: ${{ needs.changes.outputs.podcast_worker }}
          INDEXING_WORKER_FLAG: ${{ needs.changes.outputs.indexing_worker }}
          WIRE_CORPUS_EDGE_FLAG: ${{ needs.changes.outputs.wire_corpus_edge }}
          DATABASE_MIGRATOR_FLAG: ${{ needs.changes.outputs.database_migrator }}
          LEXICONS_FLAG: ${{ needs.changes.outputs.lexicons }}
          SPEC_FLAG: ${{ needs.changes.outputs.spec }}
          DOCS_FLAG: ${{ needs.changes.outputs.docs }}
          BENCHMARK_TOOLS_FLAG: ${{ needs.changes.outputs.benchmark_tools }}
          WEB_RESULT: ${{ needs.web.result }}
          OPERATIONS_WEB_RESULT: ${{ needs.operations-web.result }}
          APPLE_RESULT: ${{ needs.apple.result }}
          REDIS_RESULT: ${{ needs.redis.result }}
          GATEWAY_RESULT: ${{ needs.gateway.result }}
          APPVIEW_RESULT: ${{ needs.appview.result }}
          OPERATIONS_RESULT: ${{ needs.operations.result }}
          GO_PACKAGES_RESULT: ${{ needs.go-packages.result }}
          JETSTREAM_INGEST_RESULT: ${{ needs.jetstream-ingest.result }}
          WIRE_INGEST_RESULT: ${{ needs.wire-ingest.result }}
          PODCAST_WORKER_RESULT: ${{ needs.podcast-worker.result }}
          INDEXING_WORKER_RESULT: ${{ needs.indexing-worker.result }}
          WIRE_CORPUS_EDGE_RESULT: ${{ needs.wire-corpus-edge.result }}
          DATABASE_MIGRATOR_RESULT: ${{ needs.database-migrator.result }}
          LEXICONS_RESULT: ${{ needs.lexicons.result }}
          SPEC_RESULT: ${{ needs.spec.result }}
          DOCS_RESULT: ${{ needs.docs.result }}
          BENCHMARK_TOOLS_RESULT: ${{ needs.benchmark-tools.result }}
        run: |
          set -euo pipefail

          fail() {
            echo "::error::$1"
            exit 1
          }

          if [[ "$CHANGES_RESULT" != "success" ]]; then
            fail "Path detection failed ($CHANGES_RESULT)"
          fi

          check() {
            local flag="$1"
            local result="$2"
            local name="$3"

            if [[ "$flag" == "true" && "$result" != "success" ]]; then
              fail "$name must pass when its paths change (got $result)"
            fi
            if [[ "$flag" != "true" && "$result" != "success" && "$result" != "skipped" ]]; then
              fail "$name ended with $result"
            fi
          }

          check "$WEB_FLAG" "$WEB_RESULT" "Web"
          check "$OPERATIONS_WEB_FLAG" "$OPERATIONS_WEB_RESULT" "Operations Web"
          check "$APPLE_FLAG" "$APPLE_RESULT" "Apple"
          check "$REDIS_FLAG" "$REDIS_RESULT" "SocialWire Redis"
          check "$GATEWAY_FLAG" "$GATEWAY_RESULT" "Gateway"
          check "$APPVIEW_FLAG" "$APPVIEW_RESULT" "AppView"
          check "$OPERATIONS_FLAG" "$OPERATIONS_RESULT" "Operations"
          check "$GO_PACKAGES_FLAG" "$GO_PACKAGES_RESULT" "Repository-local Go Packages"
          check "$JETSTREAM_INGEST_FLAG" "$JETSTREAM_INGEST_RESULT" "Jetstream V2 Ingest"
          check "$WIRE_INGEST_FLAG" "$WIRE_INGEST_RESULT" "The Wire Global Ingest"
          check "$PODCAST_WORKER_FLAG" "$PODCAST_WORKER_RESULT" "Podcast Media Worker"
          check "$INDEXING_WORKER_FLAG" "$INDEXING_WORKER_RESULT" "Replicated Indexing Worker"
          check "$WIRE_CORPUS_EDGE_FLAG" "$WIRE_CORPUS_EDGE_RESULT" "The Wire Corpus Edge"
          check "$DATABASE_MIGRATOR_FLAG" "$DATABASE_MIGRATOR_RESULT" "Database Migrator"
          check "$LEXICONS_FLAG" "$LEXICONS_RESULT" "Lexicons"
          check "$SPEC_FLAG" "$SPEC_RESULT" "OpenAPI Spec"
          check "$DOCS_FLAG" "$DOCS_RESULT" "Documentation"
          check "$BENCHMARK_TOOLS_FLAG" "$BENCHMARK_TOOLS_RESULT" "Benchmark Tools"
