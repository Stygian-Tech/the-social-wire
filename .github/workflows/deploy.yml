name: Deploy

# Production deploys run automatically at the end of CI on push to main.
on:
  workflow_dispatch:
    inputs:
      deploy_appview:
        description: Also deploy AppView
        required: true
        type: boolean
        default: true
      deploy_appview_worker:
        description: Also deploy Charybdis
        required: true
        type: boolean
        default: true
      deploy_tap:
        description: Deploy the environment-isolated Tap service before the worker
        required: true
        type: boolean
        default: false
      deploy_operations:
        description: Also deploy operations control plane
        required: true
        type: boolean
        default: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy-gateway:
    name: Deploy Gateway (Fly.io)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - uses: superfly/flyctl-actions/setup-flyctl@v1

      - name: Deploy gateway to Fly.io
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          FLY_ORG: ${{ secrets.FLY_ORG }}
          FLY_GATEWAY_APP_PROD: ${{ secrets.FLY_GATEWAY_APP_PROD }}
        run: bash scripts/fly-deploy-gateway.sh main

      - name: Deploy AppView to Fly.io
        if: inputs.deploy_appview
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          FLY_ORG: ${{ secrets.FLY_ORG }}
          FLY_APPVIEW_APP_PROD: ${{ secrets.FLY_APPVIEW_APP_PROD }}
        run: bash scripts/fly-deploy-appview.sh main

      - name: Deploy Tap to Fly.io
        if: inputs.deploy_tap
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          FLY_ORG: ${{ secrets.FLY_ORG }}
        run: bash scripts/fly-deploy-tap.sh main

      - name: Deploy Charybdis to Fly.io
        if: inputs.deploy_appview_worker
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          FLY_ORG: ${{ secrets.FLY_ORG }}
          FLY_APPVIEW_WORKER_APP_PROD: ${{ secrets.FLY_APPVIEW_WORKER_APP_PROD }}
        run: bash scripts/fly-deploy-appview-worker.sh main

      - name: Deploy operations control plane to Fly.io
        if: inputs.deploy_operations
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          FLY_ORG: ${{ secrets.FLY_ORG }}
          FLY_OPERATIONS_APP_PROD: ${{ secrets.FLY_OPERATIONS_APP_PROD }}
          SUPABASE_DATABASE_URL: ${{ secrets.SUPABASE_PROD_DATABASE_URL }}
        run: bash scripts/fly-deploy-operations.sh main

  # ── Web deploy (Vercel handles this via its GitHub integration) ────────────
  # Separate Web and Operations Vercel projects deploy main; their ignored-build command skips dev.
